<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 562" width="1280" height="562" role="img" aria-labelledby="title desc"><title id="title">Primary benchmark methodology</title><desc id="desc">Two independent pipelines with training, validation checkpoint selection and frozen test evaluation. ResNet-50 compares CE, weighted CE and focal loss; U-Net compares 2D and 3D context. Diagram is original vector artwork without participant data.</desc><rect x="0" y="0" width="1280" height="562" rx="20" fill="#F7FAFC" stroke="none"/><text x="38" y="53" fill="#152D42" font-size="29" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two tasks. One evaluation discipline.</text><text x="38" y="88" fill="#536D80" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Training learns parameters; validation selects checkpoints; test estimates performance.</text><text x="38" y="132" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">01  INPUT &amp; SPLIT</text><text x="349" y="132" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">02  INDEPENDENT TRAINING</text><text x="660" y="132" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">03  VALIDATION SELECTION</text><text x="971" y="132" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">04  FROZEN TEST</text><rect x="38" y="151" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="38" y="151" width="6" height="144" rx="3" fill="#0072B2" stroke="none"/><text x="60" y="185" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Dermoscopy</text><text x="60" y="218" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">ISIC 2018 · seven classes</text><text x="60" y="242" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Train / validation / test</text><text x="60" y="266" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">10,015 / 193 / 1,512 images</text><rect x="349" y="151" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="349" y="151" width="6" height="144" rx="3" fill="#0072B2" stroke="none"/><text x="371" y="185" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">ResNet-50</text><text x="371" y="218" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Shared ImageNet initialization</text><text x="371" y="242" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">CE · weighted CE · focal</text><text x="371" y="266" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Independent optimization</text><rect x="660" y="151" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="660" y="151" width="6" height="144" rx="3" fill="#0072B2" stroke="none"/><text x="682" y="185" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Validation accuracy</text><text x="682" y="218" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Macro F1 breaks ties</text><text x="682" y="242" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Early stopping on validation</text><text x="682" y="266" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No test-driven selection</text><rect x="971" y="151" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="971" y="151" width="6" height="144" rx="3" fill="#0072B2" stroke="none"/><text x="993" y="185" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Classification</text><text x="993" y="218" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Argmax predictions</text><text x="993" y="242" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Per-class and macro metrics</text><text x="993" y="266" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Paired bootstrap contrasts</text><rect x="38" y="327" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="38" y="327" width="6" height="144" rx="3" fill="#009E73" stroke="none"/><text x="60" y="361" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Left atrial MRI</text><text x="60" y="394" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Case-separated HDF5 volumes</text><text x="60" y="418" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Train / validation / test</text><text x="60" y="442" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">11 / 3 / 20 volumes</text><rect x="349" y="327" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="349" y="327" width="6" height="144" rx="3" fill="#009E73" stroke="none"/><text x="371" y="361" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">U-Net</text><text x="371" y="394" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2D slices · 3D patches</text><text x="371" y="418" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Image-only normalization</text><text x="371" y="442" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">CE + foreground soft Dice</text><rect x="660" y="327" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="660" y="327" width="6" height="144" rx="3" fill="#009E73" stroke="none"/><text x="682" y="361" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Validation Dice</text><text x="682" y="394" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Whole-volume inference</text><text x="682" y="418" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Same held-out cases</text><text x="682" y="442" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Checkpoint hash recorded</text><rect x="971" y="327" width="273" height="144" rx="13" fill="#FFFFFF" stroke="#D8E4EC"/><rect x="971" y="327" width="6" height="144" rx="3" fill="#009E73" stroke="none"/><text x="993" y="361" fill="#152D42" font-size="22" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Segmentation</text><text x="993" y="394" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Gaussian window fusion</text><text x="993" y="418" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Dice · Jaccard · ASD · HD95</text><text x="993" y="442" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Every supplied test voxel</text><path d="M315,223 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#0072B2" stroke-width="2" stroke-linecap="round"/><path d="M626,223 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#0072B2" stroke-width="2" stroke-linecap="round"/><path d="M937,223 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#0072B2" stroke-width="2" stroke-linecap="round"/><path d="M315,399 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round"/><path d="M626,399 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round"/><path d="M937,399 h27 m-7,-6 7,6 -7,6" fill="none" stroke="#009E73" stroke-width="2" stroke-linecap="round"/><rect x="38" y="493" width="1206" height="41" rx="10" fill="#EAF1F6" stroke="none"/><text x="60" y="520" fill="#536D80" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">PRIMARY PROTOCOL  ·  Single seed 42  ·  Test partitions remain outside fitting and model selection</text></svg>
