<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="title desc"><title id="title">Primary results at a glance</title><desc id="desc">CE classification accuracy 79.50 percent. Weighted CE macro recall improves by 7.25 percentage points while accuracy decreases by 3.37 percentage points. 3D U-Net mean Dice 86.54 percent.</desc><rect x="0" y="0" width="1280" height="220" rx="20" fill="#F5F9FC" stroke="none"/><rect x="20" y="20" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#E0E9EF"/><rect x="40" y="41" width="4" height="18" rx="2" fill="#0072B2" stroke="none"/><text x="56" y="55" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">CLASSIFICATION</text><text x="45" y="109" fill="#0072B2" font-size="40" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">79.50%</text><text x="45" y="144" fill="#152D42" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">CE test accuracy</text><text x="45" y="176" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">1,512 held-out images</text><rect x="440" y="20" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#E0E9EF"/><rect x="460" y="41" width="4" height="18" rx="2" fill="#D55E00" stroke="none"/><text x="476" y="55" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">LOSS TRADE-OFF</text><text x="465" y="109" fill="#D55E00" font-size="40" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">+7.25 pp</text><text x="465" y="144" fill="#152D42" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Weighted CE macro recall vs CE</text><text x="465" y="176" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Accuracy decreases by 3.37 pp</text><rect x="860" y="20" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#E0E9EF"/><rect x="880" y="41" width="4" height="18" rx="2" fill="#009E73" stroke="none"/><text x="896" y="55" fill="#536D80" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">VOLUMETRIC SEGMENTATION</text><text x="885" y="109" fill="#009E73" font-size="40" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">86.54%</text><text x="885" y="144" fill="#152D42" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">3D U-Net mean Dice</text><text x="885" y="176" fill="#536D80" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">20 held-out volumes</text></svg>
